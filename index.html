<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four-Bar Mechanism Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family: Helvetica, Arial, sans-serif;
    background:#f0f0f0;
    color:#262626;
    font-size:14px;
  }
  header {
    height:46px;
    background:#f0f0f0;
    color:#333333;
    border-bottom:1px solid #b8b8b8;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:none;
  }
  header h1 {
    margin:0;
    font-size:16px;
    line-height:46px;
    font-weight:600;
    letter-spacing:0;
  }
  header p, header:after { display:none; }

  .layout {
    display:grid;
    grid-template-columns: 280px 330px minmax(650px, 1fr);
    gap:10px;
    padding:8px;
    height:calc(100vh - 46px);
    min-height:720px;
    max-width:none;
    margin:0;
  }
  .panel {
    background:#f0f0f0;
    border:1px solid #9e9e9e;
    border-radius:0;
    overflow:auto;
    box-shadow:none;
  }
  .panel h2 {
    margin:0;
    height:28px;
    padding:5px 7px;
    font-size:14px;
    line-height:17px;
    font-weight:400;
    text-transform:none;
    letter-spacing:0;
    color:#262626;
    background:#f0f0f0;
    border-bottom:1px solid #9e9e9e;
  }
  .body { padding:12px; }
  .section {
    margin:12px 0 7px;
    padding:0;
    border:0;
    font-size:12px;
    font-weight:600;
    color:#444;
    text-transform:none;
    letter-spacing:0;
  }
  .section:first-child { margin-top:0; }
  .field {
    display:grid;
    grid-template-columns: 1fr 122px;
    gap:10px;
    align-items:center;
    margin-bottom:11px;
    font-size:13px;
  }
  .field label { color:#262626; }
  input, select, button { font-family:Helvetica, Arial, sans-serif; font-size:13px; }
  input[type=number], select {
    width:100%;
    height:30px;
    padding:4px 7px;
    border:1px solid #9e9e9e;
    border-radius:0;
    background:#fff;
    color:#262626;
    outline:none;
    text-align:right;
  }
  select { text-align:left; }
  input[type=number]:focus, select:focus {
    border-color:#0072BD;
    box-shadow:0 0 0 1px #0072BD;
  }
  .buttons {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
  }
  button {
    height:31px;
    padding:4px 8px;
    border:1px solid #8d8d8d;
    border-radius:4px;
    background:#f5f5f5;
    color:#262626;
    cursor:pointer;
    font-weight:400;
  }
  button.primary {
    background:#f5f5f5;
    color:#262626;
    border:2px solid #0072BD;
  }
  #stop { grid-column:1/2; }
  button:hover { background:#e9e9e9; filter:none; }
  .status {
    margin-top:12px;
    min-height:38px;
    padding:7px;
    border:1px solid #d0d0d0;
    border-left:1px solid #d0d0d0;
    border-radius:0;
    background:#fff;
    color:#555;
    font-size:11px;
    line-height:1.35;
  }
  .result {
    display:grid;
    grid-template-columns:1fr 145px;
    align-items:center;
    gap:10px;
    padding:0;
    margin-bottom:11px;
    border:0;
    font-size:13px;
  }
  .result span:first-child { color:#262626; }
  .result span:last-child {
    display:block;
    height:30px;
    line-height:28px;
    padding:0 7px;
    border:1px solid #b8b8b8;
    background:#f8f8f8;
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-weight:400;
    color:#262626;
  }
  .chartbox {
    height:170px;
    margin-top:8px;
    padding:0;
    border:0;
    border-radius:0;
    background:#fff;
  }
  .canvas-wrap {
    height:calc(100% - 28px);
    min-height:650px;
    padding:14px;
    display:flex;
    flex-direction:column;
    background:#f0f0f0;
  }
  #mech {
    width:100%;
    flex:1;
    min-height:520px;
    border:0;
    border-radius:0;
    background:#fff;
  }
  .sliderrow {
    margin-top:10px;
    padding:8px 10px;
    background:#f0f0f0;
    border:1px solid #b8b8b8;
    border-radius:0;
  }
  .sliderlabel {
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:4px;
    color:#262626;
  }
  .sliderlabel strong { color:#262626; font-size:12px; }
  input[type=range] { width:100%; accent-color:#0072BD; }
  @media(max-width:1100px){
    .layout{grid-template-columns:280px 1fr;height:auto}
    .animation{grid-column:1/-1;height:720px}
  }
</style>
</head>
<body>
<header>
  <h1>4-Bar Mechanism Analyzer</h1>
  
</header>

<div class="layout">
  <section class="panel">
    <h2>Inputs</h2>
    <div class="body">
      <div class="section">Link lengths</div>
      <div class="field"><label>r1</label><input id="r1" type="number" value="8" step="0.1"></div>
      <div class="field"><label>r2</label><input id="r2" type="number" value="3" step="0.1"></div>
      <div class="field"><label>r3</label><input id="r3" type="number" value="7" step="0.1"></div>
      <div class="field"><label>r4</label><input id="r4" type="number" value="6" step="0.1"></div>

      <div class="section">Input motion</div>
      <div class="field"><label>θ2 (deg)</label><input id="theta2" type="number" value="40" step="1"></div>
      <div class="field"><label>ω2 (rad/s)</label><input id="omega2" type="number" value="2" step="0.1"></div>
      <div class="field"><label>Branch</label><select id="branch"><option value="open">open</option><option value="crossed">crossed</option></select></div>

      <div class="section">Animation range</div>
      <div class="field"><label>θ start</label><input id="start" type="number" value="0" step="1"></div>
      <div class="field"><label>θ end</label><input id="end" type="number" value="360" step="1"></div>
      <div class="field"><label>θ step</label><input id="step" type="number" value="2" step="1" min="0.1"></div>

      <div class="buttons">
        <button id="solve">Solve</button>
        <button id="animate" class="primary">▶ Animate</button>
        <button id="stop">■ Stop</button>
      </div>
      <div id="status" class="status">Ready.</div>
    </div>
  </section>

  <section class="panel">
    <h2>Results</h2>
    <div class="body">
      <div class="result"><span>θ3 (deg)</span><span id="o3">—</span></div>
      <div class="result"><span>θ4 (deg)</span><span id="o4">—</span></div>
      <div class="result"><span>ω3 (rad/s)</span><span id="w3">—</span></div>
      <div class="result"><span>ω4 (rad/s)</span><span id="w4">—</span></div>
      <div class="result"><span>Δθ34 (deg)</span><span id="dt">—</span></div>
      <div class="chartbox"><canvas id="angleChart"></canvas></div>
      <div class="chartbox"><canvas id="velChart"></canvas></div>
      <div class="chartbox"><canvas id="deltaChart"></canvas></div>
    </div>
  </section>

  <section class="panel animation">
    <h2>Animation</h2>
    <div class="canvas-wrap">
      <canvas id="mech"></canvas>
      <div class="sliderrow">
        <div class="sliderlabel"><span>Input angle θ2</span><strong><span id="sliderValue">40</span>°</strong></div>
        <input id="slider" type="range" min="0" max="360" value="40" step="1">
      </div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const rad = d => d*Math.PI/180;
const deg = r => r*180/Math.PI;
let animating=false, timer=null;

function inputs(){
  return {
    r1:+$('r1').value, r2:+$('r2').value, r3:+$('r3').value, r4:+$('r4').value,
    theta2:rad(+$('theta2').value), omega2:+$('omega2').value, branch:$('branch').value
  };
}

function position(r1,r2,r3,r4,t2,branch){
  const O4={x:r1,y:0}, A={x:r2*Math.cos(t2),y:r2*Math.sin(t2)};
  const dx=O4.x-A.x, dy=O4.y-A.y, d=Math.hypot(dx,dy);
  if(d > r3+r4 || d < Math.abs(r3-r4) || d===0) throw new Error("No real configuration for the given dimensions and input angle.");
  const a=(r3*r3-r4*r4+d*d)/(2*d);
  const h2=Math.max(0,r3*r3-a*a), h=Math.sqrt(h2);
  const P={x:A.x+a*dx/d,y:A.y+a*dy/d};
  const px=-dy/d, py=dx/d;
  const B1={x:P.x+h*px,y:P.y+h*py}, B2={x:P.x-h*px,y:P.y-h*py};
  const B=branch==="crossed"?B2:B1;
  return {A,B,t3:Math.atan2(B.y-A.y,B.x-A.x),t4:Math.atan2(B.y-O4.y,B.x-O4.x)};
}

function velocity(r2,r3,r4,t2,t3,t4,w2){
  const a=-r3*Math.sin(t3), b=r4*Math.sin(t4), c=r3*Math.cos(t3), d=-r4*Math.cos(t4);
  const e=r2*w2*Math.sin(t2), f=-r2*w2*Math.cos(t2);
  const det=a*d-b*c;
  if(Math.abs(det)<1e-10) return {w3:NaN,w4:NaN};
  return {w3:(e*d-b*f)/det,w4:(a*f-e*c)/det};
}

function solveAt(thetaDeg, updateCharts=true){
  const p=inputs(); p.theta2=rad(thetaDeg);
  const q=position(p.r1,p.r2,p.r3,p.r4,p.theta2,p.branch);
  const v=velocity(p.r2,p.r3,p.r4,p.theta2,q.t3,q.t4,p.omega2);
  const delta=deg(Math.atan2(Math.sin(q.t4-q.t3),Math.cos(q.t4-q.t3)));
  $('o3').textContent=deg(q.t3).toFixed(2);
  $('o4').textContent=deg(q.t4).toFixed(2);
  $('w3').textContent=Number.isFinite(v.w3)?v.w3.toFixed(3):"singular";
  $('w4').textContent=Number.isFinite(v.w4)?v.w4.toFixed(3):"singular";
  $('dt').textContent=delta.toFixed(2);
  draw(p,q,v,thetaDeg,delta);
  if(updateCharts) refreshFullCharts({t2:thetaDeg,t3:deg(q.t3),t4:deg(q.t4),w3:v.w3,w4:v.w4,delta});
  return {t2:thetaDeg,t3:deg(q.t3),t4:deg(q.t4),w3:v.w3,w4:v.w4,delta};
}

function draw(p,q,v,t2deg,delta){
  const c=$('mech'), rect=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=rect.width*dpr; c.height=rect.height*dpr;
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height, lim=p.r1+p.r2+p.r3+p.r4;
  const xmin=-.25*lim,xmax=1.25*lim,ymin=-.68*lim,ymax=.68*lim;
  const sx=W/(xmax-xmin), sy=H/(ymax-ymin), s=Math.min(sx,sy);
  const X=x=>(x-xmin)*s+(W-(xmax-xmin)*s)/2;
  const Y=y=>H-((y-ymin)*s+(H-(ymax-ymin)*s)/2);
  const O2={x:0,y:0},O4={x:p.r1,y:0};
  ctx.clearRect(0,0,W,H);

  // subtle engineering grid
  ctx.strokeStyle="#e6e6e6"; ctx.lineWidth=1;
  const grid=Math.max(1,Math.round(lim/18));
  for(let x=Math.ceil(xmin/grid)*grid;x<=xmax;x+=grid){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),H);ctx.stroke();}
  for(let y=Math.ceil(ymin/grid)*grid;y<=ymax;y+=grid){ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(W,Y(y));ctx.stroke();}
  ctx.strokeStyle="#cfd8df";ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.stroke();

  // ground link
  ctx.strokeStyle="#0072BD";ctx.lineWidth=3;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(X(O2.x),Y(0));ctx.lineTo(X(O4.x),Y(0));ctx.stroke();

  // moving links: input / coupler / output
  const links=[
    [O2,q.A,"#0072BD"],
    [q.A,q.B,"#0072BD"],
    [q.B,O4,"#0072BD"]
  ];
  links.forEach(([a,b,col])=>{
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(a.x),Y(a.y));ctx.lineTo(X(b.x),Y(b.y));ctx.stroke();
  });

  // joints
  [[O2,"O₂",true],[q.A,"A",false],[q.B,"B",false],[O4,"O₄",true]].forEach(([pt,label,fixed])=>{
    if(fixed){
      ctx.fillStyle="#273847";ctx.beginPath();ctx.moveTo(X(pt.x)-8,Y(pt.y)+11);ctx.lineTo(X(pt.x)+8,Y(pt.y)+11);ctx.lineTo(X(pt.x),Y(pt.y)+1);ctx.closePath();ctx.fill();
    }
    ctx.beginPath();ctx.fillStyle="#fff";ctx.strokeStyle=fixed?"#273847":"#2166a5";ctx.lineWidth=3;
    ctx.arc(X(pt.x),Y(pt.y),6,0,2*Math.PI);ctx.fill();ctx.stroke();
    ctx.fillStyle="#263746";ctx.font="600 13px Arial";ctx.fillText(label,X(pt.x)+10,Y(pt.y)-9);
  });

  // theta2 reference and arc
  const ar=.16*lim, t=rad(t2deg);
  ctx.setLineDash([5,4]);ctx.strokeStyle="#FF0000";ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(ar*1.25),Y(0));ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle="#FF0000";ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=48;i++){let a=t*i/48,x=X(ar*Math.cos(a)),y=Y(ar*Math.sin(a));i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
  ctx.fillStyle="#FF0000";ctx.font="600 13px Arial";ctx.fillText("θ₂ = "+t2deg.toFixed(1)+"°",X(.78*ar*Math.cos(t/2)),Y(.78*ar*Math.sin(t/2))-5);

  // link labels
  function linkLabel(a,b,text,col,dy=0){
    ctx.fillStyle=col;ctx.font="600 11px Arial";
    ctx.fillText(text,(X(a.x)+X(b.x))/2+5,(Y(a.y)+Y(b.y))/2-7+dy);
  }
  linkLabel(O2,q.A,"r₂","#262626");
  linkLabel(q.A,q.B,"r₃","#262626");
  linkLabel(q.B,O4,"r₄","#262626");
  ctx.fillStyle="#455564";ctx.font="600 11px Arial";ctx.fillText("r₁",(X(O2.x)+X(O4.x))/2,Y(0)+20);

  // compact result card
  const boxW=190,boxH=116,bx=18,by=18;
  ctx.fillStyle="rgba(255,255,255,.95)";ctx.strokeStyle="#d9e1e7";ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(bx,by,boxW,boxH,7);ctx.fill();ctx.stroke();
  ctx.fillStyle="#16324f";ctx.font="600 11px Arial";ctx.fillText("CURRENT CONFIGURATION",bx+12,by+19);
  ctx.fillStyle="#3c4b58";ctx.font="12px Arial";
  const lines=[`θ₃   ${deg(q.t3).toFixed(1)}°`,`θ₄   ${deg(q.t4).toFixed(1)}°`,`Δθ₃₄   ${delta.toFixed(1)}°`,`ω₃   ${Number.isFinite(v.w3)?v.w3.toFixed(3):"singular"} rad/s`,`ω₄   ${Number.isFinite(v.w4)?v.w4.toFixed(3):"singular"} rad/s`];
  lines.forEach((txt,i)=>ctx.fillText(txt,bx+12,by+39+i*15));

  // title inside plot
  ctx.fillStyle="#233647";ctx.font="600 15px Arial";ctx.textAlign="center";
  ctx.fillText("Four-Bar Mechanism",W/2,28);ctx.textAlign="start";
}
const MATLAB_BLUE="#0072BD", MATLAB_ORANGE="#D95319";
const common={
  responsive:true,maintainAspectRatio:false,animation:false,
  plugins:{
    legend:{labels:{boxWidth:20,font:{family:"Helvetica, Arial, sans-serif",size:11},color:"#262626",
      filter:(item)=>item.text!=="Current"}},
  },
  scales:{
    x:{grid:{color:"#e6e6e6"},ticks:{font:{size:10},color:"#262626"},
       title:{display:true,text:"Input Angle θ₂ (deg)",font:{size:11},color:"#262626"}},
    y:{grid:{color:"#e6e6e6"},ticks:{font:{size:10},color:"#262626"}}
  }
};
function chartOptions(title,ylabel){
  return {...common,
    plugins:{...common.plugins,title:{display:true,text:title,color:"#262626",font:{size:13,weight:"bold"}}},
    scales:{
      ...common.scales,
      y:{...common.scales.y,title:{display:true,text:ylabel,color:"#262626",font:{size:11}}}
    }
  };
}
const angleChart=new Chart($('angleChart'),{
 type:'line',
 data:{labels:[],datasets:[
  {label:'θ₃',data:[],pointRadius:0,borderWidth:2,borderColor:MATLAB_BLUE,backgroundColor:MATLAB_BLUE},
  {label:'θ₄',data:[],pointRadius:0,borderWidth:2,borderColor:MATLAB_ORANGE,backgroundColor:MATLAB_ORANGE},
  {label:'Current',data:[],pointRadius:5,showLine:false,borderWidth:2,borderColor:"#262626",backgroundColor:"#fff"}
 ]},
 options:chartOptions('Angles','Angle (deg)')
});
const velChart=new Chart($('velChart'),{
 type:'line',
 data:{labels:[],datasets:[
  {label:'ω₃',data:[],pointRadius:0,borderWidth:2,borderColor:MATLAB_BLUE,backgroundColor:MATLAB_BLUE},
  {label:'ω₄',data:[],pointRadius:0,borderWidth:2,borderColor:MATLAB_ORANGE,backgroundColor:MATLAB_ORANGE},
  {label:'Current',data:[],pointRadius:5,showLine:false,borderWidth:2,borderColor:"#262626",backgroundColor:"#fff"}
 ]},
 options:chartOptions('Angular Velocity','Angular Velocity (rad/s)')
});
const deltaChart=new Chart($('deltaChart'),{
 type:'line',
 data:{labels:[],datasets:[
  {label:'Δθ₃₄',data:[],pointRadius:0,borderWidth:2,borderColor:MATLAB_BLUE,backgroundColor:MATLAB_BLUE},
  {label:'Current',data:[],pointRadius:5,showLine:false,borderWidth:2,borderColor:"#262626",backgroundColor:"#fff"}
 ]},
 options:chartOptions('Δθ₃₄','Delta Theta (deg)')
});
function fullCurve(){
  const p=inputs(), start=+$('start').value, end=+$('end').value;
  let step=Math.max(1,(end-start)/360), hist=[];
  for(let t=start;t<=end+1e-9;t+=step){
    try{
      const q=position(p.r1,p.r2,p.r3,p.r4,rad(t),p.branch);
      const v=velocity(p.r2,p.r3,p.r4,rad(t),q.t3,q.t4,p.omega2);
      const delta=deg(Math.atan2(Math.sin(q.t4-q.t3),Math.cos(q.t4-q.t3)));
      hist.push({t2:t,t3:deg(q.t3),t4:deg(q.t4),w3:v.w3,w4:v.w4,delta});
    }catch(e){}
  }
  return hist;
}
function setCharts(hist,current=null){
  const lab=hist.map(x=>x.t2.toFixed(1));
  angleChart.data.labels=lab;
  angleChart.data.datasets[0].data=hist.map(x=>x.t3);
  angleChart.data.datasets[1].data=hist.map(x=>x.t4);
  angleChart.data.datasets[2].data=hist.map(x=>current && Math.abs(x.t2-current.t2)<0.55 ? current.t3 : null);
  velChart.data.labels=lab;
  velChart.data.datasets[0].data=hist.map(x=>Number.isFinite(x.w3)?x.w3:null);
  velChart.data.datasets[1].data=hist.map(x=>Number.isFinite(x.w4)?x.w4:null);
  velChart.data.datasets[2].data=hist.map(x=>current && Math.abs(x.t2-current.t2)<0.55 ? current.w3 : null);
  deltaChart.data.labels=lab;
  deltaChart.data.datasets[0].data=hist.map(x=>x.delta);
  deltaChart.data.datasets[1].data=hist.map(x=>current && Math.abs(x.t2-current.t2)<0.55 ? current.delta : null);
  angleChart.update();velChart.update();deltaChart.update();
}
function refreshFullCharts(current){
  setCharts(fullCurve(),current);
}
function syncTheta(v){
  $('theta2').value=(+v).toFixed(1); $('slider').value=Math.max(0,Math.min(360,+v)); $('sliderValue').textContent=(+v).toFixed(1);
}

$('solve').onclick=()=>{try{const t=+$('theta2').value;syncTheta(t);solveAt(t);$('status').textContent="Solved successfully.";}catch(e){$('status').textContent=e.message;}};
$('slider').oninput=()=>{animating=false;clearTimeout(timer);let t=+$('slider').value;syncTheta(t);try{solveAt(t);$('status').textContent="Drag the slider to inspect the mechanism.";}catch(e){$('status').textContent=e.message;}};
$('stop').onclick=()=>{animating=false;clearTimeout(timer);$('status').textContent="Animation stopped.";};

$('animate').onclick=()=>{
  animating=false;clearTimeout(timer);
  let t=+$('start').value,end=+$('end').value,step=+$('step').value,hist=[];
  if(step<=0){$('status').textContent="Theta step must be positive.";return;}
  animating=true;$('status').textContent="Animating...";
  const frame=()=>{
    if(!animating){return;}
    if(t>end+1e-9){animating=false;$('status').textContent="Animation complete.";return;}
    try{
      syncTheta(t);const current=solveAt(t,false);refreshFullCharts(current);
    }catch(e){animating=false;$('status').textContent=e.message;return;}
    t+=step; timer=setTimeout(frame,35);
  };
  frame();
};

window.addEventListener('resize',()=>{try{solveAt(+$('theta2').value,false);}catch(e){}});
try{solveAt(40);$('status').textContent="Ready. Adjust the inputs, drag θ₂, or animate 0–360°.";}catch(e){$('status').textContent=e.message;}
</script>
</body>
</html>
